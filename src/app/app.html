@if (contacts$ | async; as contacts){

    @if (contacts.length > 0 ){
      <ul >
      @for (item of contacts; track $index){
        <li class="box">
        <p>Name: {{item.name}}</p>
        <p>Email: {{item.email}}</p>
        <p>Phone: {{item.phone}}</p>
        <p>Favorite: {{item.favorite}}</p>
          
          <button type="button" (click)="onDelete(item.id)"  class="text-red-500 hover:text-red-700 cursor-pointer" aria-label="Delete contact">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-red-500">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        </li>
      }
      </ul>
    <br>
    <br>
    <div class ="header">Add new Member</div>
    <div >
      <form (ngSubmit) = "onFormSubmit()" [formGroup] = "contactsForm">
          <div class="form-row">
            <label for="name" >Name</label>
            <input id="name" type="text" formControlName="name">
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input id="email" type="text"  formControlName="email">
          </div>
          <div class="form-row">
            <label for="phone" >Phone</label>
            <input id="phone" type="text"  formControlName="phone">
          </div>
          <div class="form-row">
            <label for="favorite" >favorite</label>
            <input id="favorite" type="checkbox" formControlName="favorite">
          </div>
          <div >            
            <button  type="submit" style="background: #007bff; color: white; padding: 10px 20px; border: 1px solid #007bff; border-radius: 5px;">Add Member</button> 

          </div>
      </form>
      </div>
    }
    @else{
      <p>No contacts found....</p>
    }
}
